name: release
run-name: "${{ inputs.version }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: '"auto" to determine via changie; "major", "minor", "patch"; or specify version'
        default: auto
        required: true
jobs:
  main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "lts/*"
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm test
      - name: Release
        run: |
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config user.name "${GITHUB_ACTOR}"
          npm version -- "$(npx changie next "${INPUT_VERSION}" || echo "${INPUT_VERSION}")"
          npm publish
          echo "Released $(npx changie latest)" >> "${GITHUB_STEP_SUMMARY}"
        env:
          GH_TOKEN: "${{ github.token }}"
          GITHUB_ACTOR: "${{ github.actor }}"
          INPUT_VERSION: "${{ inputs.version }}"
