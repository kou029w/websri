name: release
run-name: "${{ inputs.version }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: '"auto" to determine via changie; "major", "minor", "patch"; or specify version'
        default: auto
        required: true
jobs:
  main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm test
      - name: Release
        run: |
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config user.name "${GITHUB_ACTOR}"
          npm version -- "$(npx changie next "${INPUT_VERSION}" || echo "${INPUT_VERSION}")"
          npm publish
          echo "Released $(npx changie latest)" >> "${GITHUB_STEP_SUMMARY}"
        env:
          GH_TOKEN: "${{ github.token }}"
          GITHUB_ACTOR: "${{ github.actor }}"
          INPUT_VERSION: "${{ inputs.version }}"
